name: Monitor de medios

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (hora UTC)
  workflow_dispatch:          # botón para correrlo a mano

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar medios
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          EXTRA_SITES: ${{ vars.EXTRA_SITES }}
        run: python monitor.py

      - name: Guardar artículos ya avisados
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Actualizar artículos vistos"
          git push
